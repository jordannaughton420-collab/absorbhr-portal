# Builds the portal and uploads it to Krystal (cPanel "Setup Node.js App").
# Runs on every push to main once the repository variable KRYSTAL_ENABLED is "true".
# Setup: docs/GO-LIVE-KRYSTAL.md
name: Deploy to Krystal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-krystal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.KRYSTAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npm run lint
          npm test

      # Only public values are needed at build time; secret keys are set in cPanel on Krystal.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Assemble bundle
        run: |
          mkdir -p bundle/build/.next
          cp deploy/krystal/app.js bundle/
          cp -a .next/standalone/. bundle/build/
          cp -a .next/static bundle/build/.next/static
          cp -a public bundle/build/public
          if find bundle -name '.env*' | grep -q .; then echo "Refusing to upload an .env file"; exit 1; fi

      - name: Upload to Krystal
        env:
          SSH_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KRYSTAL_KNOWN_HOSTS }}
          HOST: ${{ vars.KRYSTAL_SSH_HOST }}
          PORT: ${{ vars.KRYSTAL_SSH_PORT }}
          USER: ${{ vars.KRYSTAL_SSH_USER }}
          APP_DIR: ${{ vars.KRYSTAL_APP_DIR }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_krystal && chmod 600 ~/.ssh/id_krystal
          # Pin Krystal's server key if provided; otherwise trust it on first connection.
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-722}" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          SSH="ssh -i ~/.ssh/id_krystal -p ${PORT:-722} -o StrictHostKeyChecking=yes"
          set -euo pipefail
          # Streamed as a tar over plain ssh (Krystal's shell breaks rsync). The new build is unpacked beside the
          # old one and swapped in; node_modules, .htaccess, logs and Passenger's tmp in the app folder are cPanel's.
          tar -C bundle -czf - . | $SSH "$USER@$HOST" "set -e
            cd '$APP_DIR'
            rm -rf .incoming .previous && mkdir .incoming
            tar -xzf - -C .incoming
            if [ -d build ]; then mv build .previous; fi
            mv .incoming/build build && mv .incoming/app.js app.js
            rm -rf .incoming .previous
            mkdir -p tmp && touch tmp/restart.txt
            echo UPLOAD-OK" | tee "$RUNNER_TEMP/upload.log"
          grep -q '^UPLOAD-OK$' "$RUNNER_TEMP/upload.log"

      # Must be the portal's own sign-in page, not cPanel's "It works!" placeholder.
      - name: Check the live site responds
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.NEXT_PUBLIC_SITE_URL }}/login" | grep -q 'AbsorbHR'; then echo "Portal is live"; exit 0; fi
            sleep 10
          done
          echo "The site did not show the AbsorbHR sign-in page"; exit 1
