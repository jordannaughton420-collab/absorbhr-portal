# Nightly encrypted backup of the production database and files, stored on Krystal.
# Supabase's free plan has no downloadable backups, so this is the only off-site copy.
# Runs once BACKUP_ENABLED is "true". Setup and restore: docs/GO-LIVE-KRYSTAL.md (Part 7).
name: Nightly backup

on:
  schedule:
    - cron: "37 1 * * *" # 01:37 UTC
  workflow_dispatch:

concurrency:
  group: backup-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nothing below is printed to the log or uploaded to GitHub: everything stays in $WORK until it is encrypted.
      - name: Dump database, Vault secrets and files
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          WORK="$RUNNER_TEMP/absorbhr-backup"
          mkdir -p "$WORK/files"
          npx supabase db dump --db-url "$DB_URL" -f "$WORK/roles.sql" --role-only
          npx supabase db dump --db-url "$DB_URL" -f "$WORK/schema.sql"
          npx supabase db dump --db-url "$DB_URL" -f "$WORK/data.sql" --use-copy --data-only
          # The column encryption key lives in Vault, which the dumps leave out. Without it the
          # encrypted health, diversity and case data in data.sql could never be read again.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -o "$WORK/vault-secrets.json" -c \
            "select coalesce(json_agg(json_build_object('name', name, 'description', description, 'secret', decrypted_secret)), '[]') from vault.decrypted_secrets"
          grep -q '"pii_encryption_key"' "$WORK/vault-secrets.json" || { echo "pii_encryption_key missing from Vault"; exit 1; }
          grep -q 'auth.*users' "$WORK/data.sql" || { echo "data.sql has no auth.users"; exit 1; }
          node scripts/backup-storage.mjs "$WORK/files"
          ls -la "$WORK"

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then echo "BACKUP_PASSPHRASE must be at least 20 characters"; exit 1; fi
          NAME="absorbhr-backup-$(date -u +%Y-%m-%d).tar.gz.gpg"
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/pass"
          tar -C "$RUNNER_TEMP" -czf - absorbhr-backup \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" \
                --symmetric --cipher-algo AES256 -o "$RUNNER_TEMP/$NAME"
          rm -rf "$RUNNER_TEMP/absorbhr-backup"
          # Prove the file opens with the passphrase before relying on it.
          gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/pass" -d "$RUNNER_TEMP/$NAME" \
            | tar -tzf - | grep -q 'absorbhr-backup/data.sql'
          rm -f "$RUNNER_TEMP/pass"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/$NAME"

      # Stored outside the website folder (the deploy job replaces that folder). Keeps the latest 30.
      - name: Upload to Krystal
        env:
          SSH_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KRYSTAL_KNOWN_HOSTS }}
          HOST: ${{ vars.KRYSTAL_SSH_HOST }}
          PORT: ${{ vars.KRYSTAL_SSH_PORT }}
          USER: ${{ vars.KRYSTAL_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_krystal && chmod 600 ~/.ssh/id_krystal
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-722}" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          SSH="ssh -i $HOME/.ssh/id_krystal -p ${PORT:-722} -o StrictHostKeyChecking=yes"
          $SSH "$USER@$HOST" "mkdir -p absorbhr-backups && chmod 700 absorbhr-backups"
          rsync -a --chmod=F600 -e "$SSH" "$RUNNER_TEMP/$NAME" "$USER@$HOST:absorbhr-backups/"
          $SSH "$USER@$HOST" 'cd absorbhr-backups && ls -1t absorbhr-backup-*.tar.gz.gpg | tail -n +31 | xargs -r rm -f && ls -lh | tail -n 5'
          rm -f "$RUNNER_TEMP/$NAME"
