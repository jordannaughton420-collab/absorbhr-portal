<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>No connection · AbsorbHR</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          Inter,
          -apple-system,
          system-ui,
          "Segoe UI",
          sans-serif;
        color: #fff;
        background: linear-gradient(140deg, #570080 0%, #460066 48%, #3b0057 100%);
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.82);
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #fff;
        color: #570080;
        font: 600 1rem/1 inherit;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#fff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.46" />
          <path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
          <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>No connection</h1>
      <p>AbsorbHR can't reach the portal. Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.href = 'https://absorbhr-portal.co.uk/dashboard'">
        Try again
      </button>
    </main>
  </body>
</html>
